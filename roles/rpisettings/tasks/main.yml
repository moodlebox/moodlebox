---
- name: Reduce memory split down to 16Mb, as we are on a headless system
  ansible.builtin.lineinfile:
    path: '/boot/firmware/config.txt'
    line: 'gpu_mem=16'
    insertafter: '^\[all\]'
    firstmatch: true
  notify:
    - Reboot box

- name: Enable shutdown/startup hardware button
  ansible.builtin.lineinfile:
    path: '/boot/firmware/config.txt'
    line: 'dtoverlay=gpio-shutdown'
    insertafter: '^# /boot/firmware/overlays/README\s*$'
  notify:
    - Reboot box

- name: Limit journald file size to 16 megabytes
  ansible.builtin.blockinfile:
    path: '/etc/systemd/journald.conf.d/journald_moodlebox.conf'
    create: true
    mode: '0644'
    block: |
      [Journal]
      SystemMaxUse=16M
  notify:
    - Restart journald service

- name: Silence system-udevd logging bug
  ansible.builtin.copy:
    src: 'usr/lib/udev/rules.d/90-alsa-restore.rules'
    dest: '/usr/lib/udev/rules.d/90-alsa-restore.rules'
    mode: '0644'

- name: Flush handlers
  ansible.builtin.meta: flush_handlers
